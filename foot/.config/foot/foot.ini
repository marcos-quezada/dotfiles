# foot terminal configuration
# full option reference: man foot.ini(5)

[main]
font=Spleen 8x16:size=14:antialias=false, Symbols Nerd Font Mono:size=12
pad=25x25

[cursor]
style=block
blink=yes

[colors-dark]
alpha=0.85

# gameboy DMG 4-shade palette — background is lightest green, foreground darkest
#
# foreground was originally the DMG's own darkest shade (0f380f, luminance
# ~44) -- very high contrast against the background. Softened using the
# same Game Boy Pocket reference image already used for the cursor color
# (sampled via ImageMagick): its dark-olive shade (4a5138, luminance ~78),
# distinctly less stark while still clearly legible. Verified against the
# REAL effective background, not just the raw configured color -- foot's
# own alpha=0.85 blends with whatever's behind the window (this machine's
# actual wallpaper, sway/walls/freebsd-kilmynda-wide.png, sampled at
# #cbcbcb), giving an effective on-screen background of #a2be2b, not the
# pure #9bbc0f below. Confirmed visually (rendered as swatches against
# that real effective background) that 4a5138 reads clearly softer than
# the original 0f380f while remaining comfortably readable.
background=9bbc0f
foreground=4a5138

# all 16 slots mapped to the 4 DMG shades
regular0=4a5138  # black (matches foreground, see above)
regular1=8b530f  # red (warm accent, outside pure DMG but needed for git/diff)
regular2=306230  # green
regular3=8bac0f  # yellow
regular4=306230  # blue
regular5=306230  # magenta
regular6=8bac0f  # cyan
regular7=9bbc0f  # white

bright0=4a5138
bright1=8b530f
bright2=306230
bright3=8bac0f
bright4=306230
bright5=306230
bright6=8bac0f
bright7=9bbc0f

# cursor: neutral gray, not green at all -- deliberately different from every
# attempt above (white, neon green, warm yellow-green), all of which had to
# "pick a side" between the dark app background (vim) and the light gameboy
# background (plain shell), looking wrong against whichever side they didn't
# favor. A hue-neutral gray stands out against BOTH through desaturation
# contrast instead -- it's the only achromatic thing on screen either way,
# rather than competing on brightness within one hue family. Real precedent:
# the DMG's own green tint was one specific hardware revision; the later
# Game Boy Pocket used a plain grayscale screen instead.
#
# The first gray attempt (c0c0c0, luminance ~192) was actually BRIGHTER than
# this palette's own lightest shade (9bbc0f, luminance ~169) -- meaning
# against the light shell background specifically it barely stood out at
# all, despite having zero hue in common with it. This palette's real
# luminance range is ~44 (0f380f, darkest) to ~169 (9bbc0f, lightest).
#
# Sourced from a real reference, not another guess: pulled an actual Game
# Boy Pocket-palette image (a real photo processed to the hardware's real
# 4-shade output, via Wikimedia Commons) and sampled its exact colors with
# ImageMagick (`magick -unique-colors`). It's not pure neutral gray at all --
# a warm olive-gray, distinctly less saturated than this palette's own DMG
# green, sitting at a genuine middle luminance (~142). Confirmed visually
# (rendered both as an isolated swatch and composited onto both real
# backgrounds) that it stands out clearly against both the dark vim
# background and the light DMG green shell background, through both
# luminance and saturation contrast rather than needing to out-brighten
# either one specifically. Text/ink color is the same reference image's
# own darkest sampled shade (near-black, not tinted at all).
#
# Foot has no runtime cursor-color override (confirmed: neither vim's OSC12
# nor a raw OSC12 escape sequence changes it live), so this is a single,
# static, global compromise shared by every app running in foot, not just
# vim.
cursor=181818 8c926b

[csd]
color=ffadb9ca

# vim: ft=dosini
