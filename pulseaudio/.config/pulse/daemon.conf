# daemon.conf - ~/.config/pulse/daemon.conf
# exit-idle-time: PulseAudio's default (20s) means the daemon exists shortly
# after the last client disconnects, then autospawns again on next user -
# paying a real ~6s cold start cost every time (confirmed via `time  pactl`).
# disabled here since a sleeping daemon costs effectively nothing (no CPU
# when idle), while the cold start stall is a real, user visible delay.
exit-idle-time = -1
