# route mpv's audio through PulseAudio instead of talking to OSS directly.
# the stock pkg-built mpv on FreeBSD has PulseAudio (and PipeWire) disabled
# at compile time — this line does nothing useful unless mpv was rebuilt
# from ports with the PulseAudio option enabled. see docs/architecture.md,
# "music playback" section, for why this is required and how it was rebuilt.
ao=pulse
